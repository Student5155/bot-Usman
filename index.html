<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой первый Mini App</title>
    <!-- Подключаем "мозги" Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        button {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <h1>Привет из Mini App! 👋</h1>
    <p id="greeting">Твой первый Telegram Mini App работает!</p>
    <button onclick="sendData()">Нажми меня</button>

    <script>
        // Получаем данные от Telegram
        const tg = window.Telegram.WebApp;
        tg.ready(); // Говорим Telegram, что приложение готово
        tg.expand(); // Разворачиваем на весь экран

        // Приветствуем пользователя по имени
        const userName = tg.initDataUnsafe.user?.first_name || 'друг';
        document.getElementById('greeting').textContent = 
            `Привет, ${userName}! Твой первый Mini App работает!`;

        // Функция, которая срабатывает при нажатии кнопки
        function sendData() {
            tg.showAlert(`Привет, ${userName}! Ты нажал кнопку! 🎉`);
        }
    </script>
</body>
</html>
